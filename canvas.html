<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="canvas">

    <div class="masterBar interactive">
      <button id="addNote" title="Agregar post-it">＋</button>
      <button id="toggleNotes" title="Mostrar / ocultar">👁</button>
      <button id="editCanvas" title="Ajustar lienzo">⬚</button>
      <button id="Close" class="close" onclick="window.close()">✕</button>
    </div>

    <div id="moveHandle" class="canvasHandle interactive" title="Mover lienzo">✥ Mover</div>
    <div id="resizeHandle" class="canvasHandle interactive" title="Redimensionar">◢</div>
    <div id="fitHandle" class="canvasHandle interactive" title="Ajustar a la pantalla">⛶ Ajustar a pantalla</div>

  </div>
  <script src="canvas.js"></script>
</body>
</html>
